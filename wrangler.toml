name="pocketweb"
usage_model="bundled"
account_id="ea5be13caa5185905117f5da671915ac"

workers_dev=true
main="cloudflare/worker.js"

node_compat=true
compatibility_date="2022-12-22"

[site]
  bucket="cloudflare/public"

[[queues.producers]]
  queue="pocketworker"
  binding="POCKETQUEUE"

[env.production]
name="pocketweb-prod"
workers_dev=false
routes=[
  { pattern = "pocketrides.com", custom_domain = true },
  { pattern = "www.pocketrides.com", custom_domain = true }
]

  [[env.production.queues.producers]]
    queue="pocketworker-prod"
    binding="POCKETQUEUE"
